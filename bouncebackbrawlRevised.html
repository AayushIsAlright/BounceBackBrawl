// whole-number rectangles and mirrored row spans, so curves are even and symmetric. Sprites are then placed on the
// full-resolution screen with no smoothing, free to move, squash and spin.

function hexRGB(h){ h=h.replace('#',''); if(h.length===3) h=h.split('').map(c=>c+c).join(''); return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]; }
function mix(a,b,t){ const A=hexRGB(a), B=hexRGB(b); return 'rgb('+A.map((v,i)=>Math.round(v+(B[i]-v)*t)).join(',')+')'; }
const lite=c=>mix(c,'#ffffff',0.35), dark=c=>mix(c,'#140a28',0.25);
function pr(g,x,y,w,h,c){ if(w>0&&h>0){ g.fillStyle=c; g.fillRect(x,y,w,h); } }
// ellipse filling the box x,y,w,h: each row is a centred span, so left/right always mirror
function pEll(g,x,y,w,h,c){
  if(w<1||h<1) return; g.fillStyle=c;
  for(let j=0;j<h;j++){ const d=(j+0.5-h/2)/(h/2); let s=Math.round(w*Math.sqrt(Math.max(0,1-d*d))); if(s<1) s=1; if((w-s)%2) s+=(s<w?1:-1); g.fillRect(x+(w-s)/2,y+j,s,1); }
}
function pEllO(g,x,y,w,h,c,o){ pEll(g,x,y,w,h,o); pEll(g,x+1,y+1,w-2,h-2,c); }
// rounded box with stepped corners of radius r
function pBox(g,x,y,w,h,c,r){
  if(w<1||h<1) return; g.fillStyle=c; r=Math.min(r||0,w/2,h/2);
  for(let j=0;j<h;j++){ const d=j<r?r-j-0.5:(j>=h-r?j-(h-r)+0.5:0); const ins=d>0?Math.round(r-Math.sqrt(Math.max(0,r*r-d*d))):0; g.fillRect(x+ins,y+j,w-2*ins,1); }
}
function pBoxO(g,x,y,w,h,c,o,r){ pBox(g,x,y,w,h,o,r); pBox(g,x+1,y+1,w-2,h-2,c,Math.max(0,(r||0)-1)); }
function clipR(g,x,y,w,h,fn){ g.save(); g.beginPath(); g.rect(x,y,w,h); g.clip(); fn(); g.restore(); }
// outlined inflatable block with a light band and a shadow band
function pPuff(g,x,y,w,h,c,r,horiz){
  pBoxO(g,x,y,w,h,c,OL,r);
  const inner=col=>pBox(g,x+1,y+1,w-2,h-2,col,Math.max(0,(r||0)-1));
  if(horiz){ const a=Math.max(1,Math.round(h*0.16)), b=Math.max(1,Math.round(h*0.22)); clipR(g,x,y+2,w,a,()=>inner(lite(c))); clipR(g,x,y+h-1-b,w,b,()=>inner(dark(c))); }
  else { const a=Math.max(1,Math.round(w*0.16)), b=Math.max(1,Math.round(w*0.22)); clipR(g,x+2,y,a,h,()=>inner(lite(c))); clipR(g,x+w-1-b,y,b,h,()=>inner(dark(c))); }
}
// spire: centred rows widening towards the base
function pSpire(g,x,y,w,h,c){
  if(w<1||h<1) return; g.fillStyle=c;
  for(let j=0;j<h;j++){ let s=Math.round(w*Math.pow((j+1)/h,1.25)); if(s<1) s=1; if((w-s)%2) s+=(s<w?1:-1); g.fillRect(x+(w-s)/2,y+j,s,1); }
}
function pOL(g,X,Y,rects,fill,ol){ for(const r of rects) pr(g,X+r[0]-1,Y+r[1]-1,r[2]+2,r[3]+2,ol); for(const r of rects) pr(g,X+r[0],Y+r[1],r[2],r[3],fill); }
// sprite canvas of w x h game pixels; drawn on screen at w*PX x h*PX world units
function bake(w,h,draw){
  const out=document.createElement('canvas'); out.width=w; out.height=h;
  const s={out,g:out.getContext('2d'),w:w*PX,h:h*PX};
  if(draw) draw(s.g);
  return s;
}
const SPR={};
function spr(key,w,h,draw){ return SPR[key]||(SPR[key]=bake(w,h,draw)); }

function resize(){

  cv.style.width=(W*s)+'px'; cv.style.height=(H*s)+'px';
  // backing store is always a whole-number multiple of the 320x180 buffer, so every game pixel stays a sharp square
  const n=Math.max(1,Math.min(8,Math.round(W*s*dpr/(W/PX))));
  cv.width=W/PX*n; cv.height=H/PX*n;
  scale=cv.width/W;
}

function bmpW(s,u){ return s.length*6*u-u; }
function ptext(c,t,x,y,k,fill,stroke,align){
  const s=String(t).toUpperCase(), u=k*PX, w=bmpW(s,u);
  let x0=align==='left'?x:align==='right'?x-w:x-w/2;
  x0=Math.round(x0/PX)*PX; const y0=Math.round((y-3.5*u)/PX)*PX;
  const pass=(ox,oy,col)=>{
    c.fillStyle=col; c.beginPath();
    for(let i=0;i<s.length;i++){ const g=FONTD[s[i]]; if(!g) continue;
      for(let r=0;r<7;r++){ const row=g[r]; if(!row) continue;
        for(let cc=0;cc<5;cc++) if(row&(16>>cc)) c.rect(x0+ox+(i*6+cc)*u,y0+oy+r*u,u,u); } }
    c.fill();
  };
  if(stroke){ const o=u; for(const [ox,oy] of [[-o,0],[o,0],[0,-o],[0,o],[-o,-o],[o,-o],[-o,o],[o,o]]) pass(ox,oy,stroke); }
  pass(0,0,fill);
}
function kFor(size){ return Math.max(1,Math.round(size/22)); }

const BUF={}; let bgSrc=null, synthMusic=false;
function loadSounds(){
  for(const n in SND_B64){
    try{
      const bin=atob(SND_B64[n]), u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i);
      AC.decodeAudioData(u.buffer,b=>{ BUF[n]=b; if(n==='bg') startBG(); },()=>{ if(n==='bg') synthMusic=true; });
    }catch(e){ if(n==='bg') synthMusic=true; }
  }
}
function startBG(){
  if(bgSrc||!BUF.bg) return;
  bgSrc=AC.createBufferSource(); bgSrc.buffer=BUF.bg; bgSrc.loop=true;
  bgSrc.loopStart=0.03; bgSrc.loopEnd=Math.max(0.1,BUF.bg.duration-0.03);
  bgSrc.connect(musicGain); bgSrc.start();
}
function sfx(name,vol,rate){
  const b=BUF[name]; if(!AC||!b) return false;
  const src=AC.createBufferSource(); src.buffer=b; src.playbackRate.value=rate||1;
  const g=AC.createGain(); g.gain.value=vol==null?0.8:vol; src.connect(g); g.connect(sfxGain); src.start();
  return true;
}

let duckUntil=0;
function duck(dur){
  if(!AC) return;
  duckUntil=performance.now()+dur*1000;
  musicGain.gain.cancelScheduledValues(AC.currentTime);
  musicGain.gain.setTargetAtTime(0,AC.currentTime,0.03);
  setTimeout(()=>{ if(AC&&performance.now()>=duckUntil-30) musicGain.gain.setTargetAtTime(musicOn?musicLevel():0,AC.currentTime,0.25); },dur*1000);
}
function jingle(name){ if(!sfx(name,0.9)) return false; duck(BUF[name].duration+0.15); return true; }
function clickSfx(){ if(!sfx('click',0.9)) tone(660,0.05,'square',0.1); }
function toneAt(t,f,dur,type,vol,f2,dest){
  if(!AC) return;
  const o=AC.createOscillator(), g=AC.createGain(); o.type=type;
  o.frequency.setValueAtTime(f,t); if(f2) o.frequency.exponentialRampToValueAtTime(f2,t+dur);
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+0.006); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g); g.connect(dest||sfxGain); o.start(t); o.stop(t+dur+0.05);
}
function tone(f,dur,type,vol,delay,f2){ if(!AC) return; toneAt(AC.currentTime+(delay||0),f,dur,type||'sine',vol==null?0.3:vol,f2,sfxGain); }
function noiseAt(t,dur,vol,hp,dest){

  const s=AC.createBufferSource(); s.buffer=noiseBuf; s.loop=true;
  const f=AC.createBiquadFilter(); f.type='highpass'; f.frequency.value=hp||800;
  const g=AC.createGain(); g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  s.connect(f); f.connect(g); g.connect(dest||sfxGain); s.start(t,Math.random()*0.5); s.stop(t+dur+0.05);

const PENTA=[0,2,4,7,9,12,14,16,19,21,24];
function ping(streak,boost){
  if(!AC) return;
  if(sfx('bounce',(scene==='title'?0.22:0.5)*(boost?1:0.7),1+Math.min(streak,6)*0.05)) return;
  const semis=PENTA[Math.min(streak,PENTA.length-1)];
  const f=523.25*Math.pow(2,semis/12);
  tone(f,0.55,'sine',boost?0.34:0.2);
  tone(f*2,0.3,'triangle',boost?0.12:0.06);
  tone(f*3.01,0.15,'sine',0.04);
}

function kick(t){ toneAt(t,150,0.13,'sine',0.55,42,musicGain); }
function snare(t){ noiseAt(t,0.12,0.22,1500,musicGain); toneAt(t,210,0.08,'triangle',0.15,120,musicGain); }
function hat(t,v){ noiseAt(t,0.035,v,7000,musicGain); }
const ROOTS=[0,-3,-7,-5];
const TONES=[[0,4,7,12],[0,4,9,12],[5,9,12,17],[7,11,14,19]];
const ARP=[0,1,2,1,3,2,1,2,0,1,2,3,2,1,2,1];
const HOOK=[3,-1,2,-1,1,-1,2,-1,3,-1,-1,2,3,-1,-1,-1];
const mf=s=>261.63*Math.pow(2,s/12);
function musicStep(i,t){
  const bar=Math.floor(i/16)%4, s=i%16, ch=TONES[bar], root=ROOTS[bar];
  if(s%4===0) kick(t);
  if(s===4||s===12) snare(t);
  if(s%4===2) hat(t,0.09); else if(s%2===1) hat(t,0.035);
  if([0,3,6,8,11,14].indexOf(s)>=0) toneAt(t,mf(root-12),STEP*1.7,'triangle',0.3,null,musicGain);
  toneAt(t,mf(ch[ARP[s]]),STEP*1.05,'square',0.03,null,musicGain);
  const h=HOOK[s];
  if(h>=0){ toneAt(t,mf(ch[h]+12),STEP*3,'sine',0.1,null,musicGain); toneAt(t,mf(ch[h]+24),STEP*1.5,'triangle',0.03,null,musicGain); }
}
function scheduler(){
  if(!AC||!synthMusic){ if(AC) nextT=AC.currentTime+0.05; return; }
  if(nextT<AC.currentTime-0.4) nextT=AC.currentTime+0.05;
  while(nextT<AC.currentTime+0.18){ musicStep(stepIdx,nextT); nextT+=STEP; stepIdx++; }

function readPlayerInput(playerKeys) {
    const anyHeld = keyList => keyList.some(key => heldKeys.has(key));

    return {
        l: anyHeld(playerKeys.l), r: anyHeld(playerKeys.r), jumpHeld: anyHeld(playerKeys.u), jumpPressed: anyTapped(playerKeys.u), down: anyTapped(playerKeys.d), punch: anyTapped(playerKeys.p), superMove: anyTapped(playerKeys.s)

function menuKey(code){

    if(helpOpen){ helpOpen=false; clickSfx(); return; }
    if(code==='Enter'||code==='Space') menuPick(0);
    else if(code==='KeyH') menuPick(1);
    else if(code==='KeyS') menuPick(2);
  } else if(scene==='match'){
    if(code==='ArrowLeft'||code==='ArrowRight'||code==='KeyA'||code==='KeyD'){ endSel=1-endSel; clickSfx(); }
    else if((code==='Enter'||code==='Space')&&sceneT>0.6) endPick(endSel);
    else if(code==='Escape'||code==='Backspace') endPick(1);

function uiKey(code){

  else if(code==='ArrowDown'||code==='KeyS'){ sel=(sel+1)%3; clickSfx(); }
  else if(ui==='pause'){
    if(code==='Enter'||code==='Space') pausePick(sel);
    else if(code==='KeyP'||code==='Escape') setPaused(false);
    else if(code==='KeyQ') pausePick(2);
  } else {
    const cur=sel===0?musicVolN:sfxVolN;
    if((code==='ArrowLeft'||code==='KeyA')&&sel<2) adjustVol(sel,cur-1);
    else if((code==='ArrowRight'||code==='KeyD')&&sel<2) adjustVol(sel,cur+1);
    else if(code==='Escape'||code==='Backspace'||((code==='Enter'||code==='Space')&&sel===2)) closeSettings();
  }
}
function uiClick(x,y){
  const i=uiAt(x,y); if(i<0) return; sel=i;
  if(ui==='pause') pausePick(i);
  else if(i===2) closeSettings();
  else if(x>=BAR_X-30) adjustVol(i,x<BAR_X?0:Math.min(10,Math.floor((x-BAR_X)/30)+1));
}
function go(action){ if(trans) return; trans={t:0,done:false,action}; whoosh(); }
function animUI(dt){
  if(trans){
    trans.t+=dt;
    if(!trans.done&&trans.t>=0.42){ trans.done=true; trans.action(); }
    if(trans.t>=1) trans=null;
  }
  if(scene==='title') menuT+=dt;
  helpA+=clamp((helpOpen?1:0)-helpA,-dt*7,dt*7);
  pauseA+=clamp((paused?1:0)-pauseA,-dt*8,dt*8);
}
function drawIris(){
  if(!trans) return;
  const t=trans.t; let k;
  if(t<0.4){ const p=t/0.4; k=1-p*p; } else if(t<0.55) k=0; else { const p=(t-0.55)/0.45; k=1-(1-p)*(1-p); }
  const r=k*570, cx=W/2, cy=H/2;
  ctx.fillStyle='#000000';
  for(let y=0;y<H;y+=PX){
    const dy=y+1.5-cy;
    if(Math.abs(dy)>=r){ ctx.fillRect(0,y,W,PX); continue; }
    const half=Math.round(Math.sqrt(r*r-dy*dy)/PX)*PX;
    if(cx-half>0){ ctx.fillRect(0,y,cx-half,PX); ctx.fillRect(cx+half,y,W-cx-half,PX); }
  }
}

const FLOOR_POINTS=96, FLOOR_POINT_GAP=W/FLOOR_POINTS;
const floorMat={height:new Float32Array(FLOOR_POINTS+1),speed:new Float32Array(FLOOR_POINTS+1),leftPush:new Float32Array(FLOOR_POINTS+1),rightPush:new Float32Array(FLOOR_POINTS+1)};
let floorTimeBank=0;
function rippleFloor() {
    for (let index = 0; index <= FLOOR_POINTS; index++) {
        const pull = -FLOOR_SPRING_PULL * floorMat.height[index] - FLOOR_SPRING_DAMPING * floorMat.speed[index];
        floorMat.speed[index] += pull;
        floorMat.height[index] += floorMat.speed[index];
        floorMat.height[index] = clamp(floorMat.height[index], -FLOOR_MAX_RISE, FLOOR_MAX_DIP);
    }
    for (let pass = 0; pass < FLOOR_RIPPLE_PASSES; pass++) {
        for (let index = 0; index <= FLOOR_POINTS; index++) {
            if (index > 0) {
                floorMat.leftPush[index] = FLOOR_RIPPLE_SPREAD * (floorMat.height[index] - floorMat.height[index - 1]);
                floorMat.speed[index - 1] += floorMat.leftPush[index];
            }
            if (index < FLOOR_POINTS) {
                floorMat.rightPush[index] = FLOOR_RIPPLE_SPREAD * (floorMat.height[index] - floorMat.height[index + 1]);
                floorMat.speed[index + 1] += floorMat.rightPush[index];
            }
        }
        for (let index = 0; index <= FLOOR_POINTS; index++) {
            if (index > 0) {
                floorMat.height[index - 1] += floorMat.leftPush[index];
            }
            if (index < FLOOR_POINTS) {
                floorMat.height[index + 1] += floorMat.rightPush[index];
            }
        }
    }
}

function dentFloor(hitX, impactSpeed) {
    const centreIndex = Math.round(hitX / FLOOR_POINT_GAP);
    for (let offset = -FLOOR_DENT_REACH; offset <= FLOOR_DENT_REACH; offset++) {
        const index = centreIndex + offset;
        if (index >= 0 && index <= FLOOR_POINTS) {
            floorMat.speed[index] += impactSpeed * FLOOR_DENT_STRENGTH * (1 - Math.abs(offset) / FLOOR_DENT_FALLOFF);
        }
    }
}

function floorDipAt(atX) {
    const position = clamp(atX / FLOOR_POINT_GAP, 0, FLOOR_POINTS - FLOOR_EDGE_MARGIN);
    const index = position | 0;
    const blend = position - index;
    return floorMat.height[index] * (1 - blend) + floorMat.height[index + 1] * blend;
}

// ---------- combat
function distanceToGround(fighter) {
    let distance = FLOOR_Y - fighter.y;
    for (const platform of platforms) {
        if (Math.abs(fighter.x - platform.x) < platform.w / 2 + PLATFORM_EDGE_GRACE && platform.y >= fighter.y - 2) {
            distance = Math.min(distance, platform.y - fighter.y);
        }
    }
    return distance;
}
function dealDamage(vic,att,dmg){
  vic.hp=Math.max(0,vic.hp-dmg);
  if(vic.hp<=0&&!vic.dead){
    if(scene==='title'){ vic.hp=100; return; }
    if(scene!=='fight') { vic.hp=Math.max(vic.hp,1); return; }
    vic.dead=true; scene='ko'; sceneT=0; koWinner=att;
    vic.stunTimer=99; vic.speedX=att.x<vic.x?520:-520; vic.speedY=-1000; vic.spin=(vic.speedX>0?1:-1)*14;
    hitstop=0.28; shake=16; flashW=0.6;
    banner('K.O.!','',1.8,'#ff4d6d'); koSfx(); stars(vic.x,vic.y-30,24,['#ffe14a','#fff','#ff9a3d'],700); ring(vic.x,vic.y-30,160,'#fff',0.6);
  }
}
function hurt(att,vic,dmg,kx,ky,stun,big){
  if(vic.invulnerableTimer>0||vic.dead) return false;
  const bonus=Math.min(att.combo,5);
  dmg+=bonus;
  vic.flash=0.14; vic.stunTimer=Math.max(vic.stunTimer,stun); vic.speedX=kx; vic.speedY=ky; vic.invulnerableTimer=0.1; vic.streak=0; vic.slam=false; vic.punchTimer=0; vic.groundedTimer=0;
  vic.meter=Math.min(100,vic.meter+8); att.meter=Math.min(100,att.meter+12);
  att.combo=att.comboTimer>0?att.combo+1:1; att.comboTimer=1.6;
  hitstop=Math.max(hitstop,0.05+dmg*0.004); shake=Math.max(shake,4+dmg*0.55);
  hitSfx(big);
  stars(vic.x,vic.y-34,big?14:8,['#ffe14a','#fff','#ff9a3d'],big?600:450);
  ring(vic.x,vic.y-34,big?100:60,'#fff',0.3);
  floatText(vic.x,vic.y-138,pick(big?['BONK!','WHAM!','BOING!!']:['POW!','BAM!','BOP!','WHAP!']),'#ffe14a',big?38:30);
  dealDamage(vic,att,dmg);
  return true;
}

let superTag=null;
function banner2(f){ superTag={t:'MEGA BOUNCE!',age:0,col:f.c1}; }
function squashOnLanding(fighter, impactSpeed) {
    const squashAmount = clamp(impactSpeed / HARDEST_LANDING_SPEED, MIN_SQUASH_AMOUNT, 1);

    fighter.stretchX = 1 + LANDING_SQUASH * squashAmount;
    fighter.stretchY = 1 - LANDING_SQUASH * squashAmount;
    fighter.stretchSpeedX = 0;
    fighter.stretchSpeedY = 0;
}

function finishSlam(fighter) {
    fighter.slam = false;
    fighter.slamCooldown = SLAM_COOLDOWN;

    const opponent = fighters[1 - fighter.i];
    slamWave(fighter, opponent);

    fighter.speedY = -SLAM_REBOUND_SPEED;
    ping(2, true);
}

function stunnedBounceSpeed(fighter, impactSpeed) {
    const bounceSpeed = Math.max(STUNNED_MIN_BOUNCE_SPEED, impactSpeed * STUNNED_BOUNCE_KEEP);

    fighter.streak = 0;
    boing();
    wallSfxSoft();
    if (fighter.dead) {
        fighter.spin *= KO_SPIN_LOSS_ON_LANDING;
    }

    return bounceSpeed;
}

function normalBounceSpeed(fighter, groundY, surface, impactSpeed) {
    const bigBounce = fighter.jumpBufferTimer > 0 || fighter.holdingJump;
    let bounceSpeed;

    if (surface === 'pad') {
        bounceSpeed = bigBounce ? PLATFORM_BIG_BOUNCE_SPEED : PLATFORM_BOUNCE_SPEED;
    } else if (bigBounce) {
        bounceSpeed = FLOOR_BIG_BOUNCE_SPEED + Math.min(fighter.streak, MAX_STREAK_BONUS_STEPS) * STREAK_BONUS_SPEED;
    } else {
        bounceSpeed = Math.max(FLOOR_MIN_BOUNCE_SPEED, impactSpeed * FLOOR_BOUNCE_KEEP);
    }

    if (bigBounce) {
        fighter.streak++;
    } else {
        fighter.streak = 0;
    }

    ping(bigBounce ? fighter.streak : 0, bigBounce);

    if (bigBounce) {
        ring(fighter.x, groundY - 2, BOUNCE_RING_SIZE, fighter.c1, BOUNCE_RING_TIME);
        dust(fighter.x, groundY, BIG_BOUNCE_DUST_COUNT, fighter.c1);
    } else {
        dust(fighter.x, groundY, BOUNCE_DUST_COUNT, '#fff');
    }

    return bounceSpeed;
}

function landFighter(fighter, groundY, surface, platform) {
    const impactSpeed = fighter.speedY;

    fighter.y = groundY;
    fighter.groundedTimer = GROUNDED_TIME;
    fighter.airJumps = 1;
    squashOnLanding(fighter, impactSpeed);

    if (surface === 'floor') {
        dentFloor(fighter.x, impactSpeed);
    } else {
        platform.dipSpeed += impactSpeed * PLATFORM_DIP_PER_SPEED;
    }

    if (fighter.slam) {
        finishSlam(fighter);
        return;
    }

    let bounceSpeed;
    if (fighter.stunTimer > 0 || fighter.dead) {
        bounceSpeed = stunnedBounceSpeed(fighter, impactSpeed);
    } else {
        bounceSpeed = normalBounceSpeed(fighter, groundY, surface, impactSpeed);
    }

    fighter.speedY = -bounceSpeed;
    fighter.jumpBufferTimer = 0;
}
function wallSfxSoft(){}
function tryStomp(a,b){
  if(a.dead||b.dead||a.stunTimer>0||a.speedY<=120||a.stompCooldown>0||b.invulnerableTimer>0) return;
  const top=b.y-92;
  if(Math.abs(a.x-b.x)<36 && a.y>=top-6 && a.y<=top+30){
    const big=a.slam, dmg=big?16:10;
    if(hurt(a,b,dmg,(a.x<b.x?1:-1)*220,300,0.4,big)){
      a.speedY=-1050; a.slam=false; a.stompCooldown=0.3; a.airJumps=1; a.streak=Math.max(a.streak,1);
      b.stretchY=0.5; b.stretchX=1.4; ping(4,true); boing();
      floatText(b.x,b.y-138,'STOMP!','#7cff6b',34);
    }
  }
}

// ---------- AI
function aiThink(f,o,dt){
  const a=f.ai; a.t-=dt;
  if(a.t<=0){
    a.t=rand(0.07,0.17);
    const dx=o.x-f.x, ad=Math.abs(dx), dy=o.y-f.y, out=a.out;
    out.l=out.r=false;
    const tow=dx>0?'r':'l', away=dx>0?'l':'r';
    let want='';
    if(ad>85) want=tow; else if(ad<40) want=Math.random()<0.5?away:''; else if(Math.random()<0.2) want=away;
    if(Math.random()<0.1) want='';
    if(want) out[want]=true;
    out.jumpHeld=Math.random()<0.88;
    if(ad>140 && Math.random()<0.08) out.jumpPressed=true;
    if(ad<84 && Math.abs(dy)<55 && ((dx>0)===(f.face>0)) && Math.random()<0.55) out.punch=true;
    if(f.y<FLOOR_Y-170 && ad<110 && o.y>f.y-20 && Math.random()<0.3) out.down=true;
    if(f.meter>=100 && ad<250 && Math.random()<0.5) out.superMove=true;
    if(o.punchTimer>0 && ad<110 && Math.random()<0.35){ out.jumpPressed=true; out[away]=true; out[tow]=false; }
  }
  const out=a.out, it={l:!!out.l,r:!!out.r,jumpHeld:!!out.jumpHeld,jumpPressed:!!out.jumpPressed,down:!!out.down,punch:!!out.punch,superMove:!!out.superMove};
  out.jumpPressed=out.down=out.punch=out.superMove=false;
  return it;
}

function tickTimers(fighter, stepTime) {
    fighter.stunTimer = Math.max(0, fighter.stunTimer - stepTime);
    fighter.invulnerableTimer -= stepTime;
    fighter.punchCooldown -= stepTime;
    fighter.slamCooldown -= stepTime;
    fighter.stompCooldown -= stepTime;
    fighter.superTimer -= stepTime;
    fighter.flash -= stepTime;
    fighter.jumpBufferTimer -= stepTime;
    fighter.groundedTimer -= stepTime;

    if (fighter.comboTimer > 0) {
        fighter.comboTimer -= stepTime;
        if (fighter.comboTimer <= 0) {
            fighter.combo = 0;
        }
    }
}

function tryJump(fighter) {
    fighter.jumpBufferTimer = JUMP_BUFFER_TIME;

    const nearGround = fighter.speedY > 0 && distanceToGround(fighter) < DOUBLE_JUMP_MIN_HEIGHT;
    if (fighter.airJumps > 0 && fighter.groundedTimer <= 0 && !nearGround) {
        fighter.airJumps--;
        fighter.speedY = -DOUBLE_JUMP_SPEED;
        fighter.stretchY = JUMP_STRETCH_TALL;
        fighter.stretchX = JUMP_STRETCH_THIN;

        ping(DOUBLE_JUMP_SOUND_PITCH, true);
        dust(fighter.x, fighter.y, DOUBLE_JUMP_DUST_COUNT, '#fff');
        ring(fighter.x, fighter.y, DOUBLE_JUMP_RING_SIZE, '#fff', DOUBLE_JUMP_RING_TIME);
    }
}

function startPunch(fighter) {
    fighter.punchTimer = PUNCH_TIME;
    fighter.punchCooldown = PUNCH_COOLDOWN;
    fighter.punchLanded = false;
    whoosh();
}

function startSlam(fighter) {
    fighter.slam = true;
    fighter.speedY = SLAM_FALL_SPEED;
    fighter.speedX *= SLAM_SIDEWAYS_KEEP;
    whoosh();
}

function startActions(fighter, opponent, input) {
    if (input.jumpPressed) {
        tryJump(fighter);
    }

    if (input.punch && fighter.punchCooldown <= 0) {
        startPunch(fighter);
    }

    if (input.down && !fighter.slam && fighter.slamCooldown <= 0 && distanceToGround(fighter) > SLAM_MIN_HEIGHT) {
        startSlam(fighter);
    }

    if (input.superMove && fighter.meter >= FULL_SUPER_METER) {
        doSuper(fighter, opponent);
    }
}

function moveSideways(fighter, opponent, input, canAct, stepTime) {
    if (canAct) {
        const direction = (input.r ? 1 : 0) - (input.l ? 1 : 0);
        const acceleration = fighter.groundedTimer > 0 ? GROUND_ACCELERATION : AIR_ACCELERATION;
        const topSpeed = MAX_RUN_SPEED;

        if (direction) {
            fighter.speedX += clamp(direction * topSpeed - fighter.speedX, -acceleration * stepTime, acceleration * stepTime);
            fighter.face = direction;
        } else {
            const friction = fighter.groundedTimer > 0 ? GROUND_FRICTION : AIR_FRICTION;
            fighter.speedX -= fighter.speedX * Math.min(1, friction * stepTime);
            fighter.face = opponent.x >= fighter.x ? 1 : -1;
        }
    } else if (fighter.stunTimer > 0 || fighter.dead) {
        fighter.speedX -= fighter.speedX * STUNNED_FRICTION * stepTime;
    } else {
        fighter.speedX -= fighter.speedX * Math.min(1, IDLE_FRICTION * stepTime);
    }
}

function punchReaches(fighter, opponent) {
    const reachStart = fighter.x + fighter.face * PUNCH_REACH_NEAR;
    const reachEnd = fighter.x + fighter.face * PUNCH_REACH_FAR;
    const reachLeft = Math.min(reachStart, reachEnd);
    const reachRight = Math.max(reachStart, reachEnd);

    const inLine = opponent.x + HALF_BODY_WIDTH > reachLeft && opponent.x - HALF_BODY_WIDTH < reachRight;
    const sameHeight = opponent.y > fighter.y - PUNCH_ZONE_TOP && opponent.y - PUNCH_TARGET_HEIGHT < fighter.y - PUNCH_ZONE_BOTTOM;
    return inLine && sameHeight;
}

function updatePunch(fighter, opponent, stepTime) {
    if (fighter.punchTimer <= 0) {
        return;
    }

    fighter.punchTimer -= stepTime;
    const elapsed = PUNCH_TIME - fighter.punchTimer;
    const fistIsOut = elapsed > PUNCH_HIT_START && elapsed < PUNCH_HIT_END;

    if (fistIsOut && !fighter.punchLanded && !opponent.dead && punchReaches(fighter, opponent)) {
        const comboBonus = Math.min(fighter.combo, MAX_COMBO_BONUS_STEPS) * COMBO_KNOCKBACK_BONUS;
        const knockback = fighter.face * (PUNCH_KNOCKBACK + comboBonus);

        if (hurt(fighter, opponent, PUNCH_DAMAGE, knockback, -PUNCH_LIFT, PUNCH_STUN_TIME, false)) {
            fighter.punchLanded = true;
        }
    }
}

function fallAndMove(fighter, stepTime) {
    fighter.speedY += (fighter.slam ? 0 : GRAVITY) * stepTime;
    if (fighter.speedY > MAX_FALL_SPEED) {
        fighter.speedY = MAX_FALL_SPEED;
    }

    fighter.x += fighter.speedX * stepTime;
    fighter.y += fighter.speedY * stepTime;
}

function splatOnWall(fighter, opponent) {
    fighter.speedX = -fighter.speedX * STUNNED_WALL_BOUNCE;
    dealDamage(fighter, opponent, WALL_SPLAT_DAMAGE);
    floatText(fighter.x, fighter.y - HIT_WORD_HEIGHT, 'SPLAT!', '#ff9ad5', WALL_SPLAT_WORD_SIZE);
    hitSfx(false);
    shake = Math.max(shake, WALL_SPLAT_SHAKE);
    hitstop = Math.max(hitstop, WALL_SPLAT_FREEZE_TIME);
    stars(fighter.x, fighter.y - BODY_CENTRE_HEIGHT, WALL_SPLAT_STAR_COUNT, ['#ff9ad5', '#fff'], WALL_SPLAT_STAR_SPEED);
}

function bounceOffWalls(fighter, opponent) {
    const leftLimit = LEFT_WALL_X + HALF_BODY_WIDTH;
    const rightLimit = RIGHT_WALL_X - HALF_BODY_WIDTH;
    if (fighter.x >= leftLimit && fighter.x <= rightLimit) {
        return;
    }

    const hitLeftWall = fighter.x < leftLimit;
    fighter.x = hitLeftWall ? leftLimit : rightLimit;

    const movingIntoWall = (hitLeftWall && fighter.speedX < 0) || (!hitLeftWall && fighter.speedX > 0);
    if (!movingIntoWall) {
        return;
    }

    const impactSpeed = Math.abs(fighter.speedX);
    if (fighter.stunTimer > 0 && impactSpeed > WALL_SPLAT_MIN_SPEED && !fighter.dead) {
        splatOnWall(fighter, opponent);
    } else {
        fighter.speedX = -fighter.speedX * (fighter.stunTimer > 0 ? STUNNED_WALL_BOUNCE : WALL_BOUNCE);
    }

    if (Math.abs(fighter.speedX) < MIN_WALL_REBOUND_SPEED && !fighter.dead) {
        fighter.speedX = hitLeftWall ? MIN_WALL_REBOUND_SPEED : -MIN_WALL_REBOUND_SPEED;
    }

    wall[hitLeftWall ? 0 : 1] = 1;
    wallSfx();
    fighter.stretchX = WALL_SQUASH_THIN;
    fighter.stretchY = WALL_SQUASH_TALL;

    const ringX = fighter.x + (hitLeftWall ? -WALL_RING_OFFSET : WALL_RING_OFFSET);
    ring(ringX, fighter.y - BODY_CENTRE_HEIGHT, WALL_RING_SIZE, '#fff', WALL_RING_TIME);
}

function bounceOffCeiling(fighter) {
    if (fighter.y - HEAD_HEIGHT >= CEILING_Y) {
        return;
    }

    fighter.y = CEILING_Y + HEAD_HEIGHT;
    if (fighter.speedY < 0) {
        fighter.speedY = -fighter.speedY * CEILING_BOUNCE;
        wallSfx();
        shake = Math.max(shake, CEILING_SHAKE);
        fighter.stretchY = CEILING_SQUASH_SHORT;
        fighter.stretchX = CEILING_SQUASH_WIDE;
    }
}

function checkLanding(fighter) {
    if (fighter.speedY > 0) {
        for (const platform of platforms) {
            const cameFromAbove = fighter.previousY <= platform.y + 2 && fighter.y >= platform.y;
            const overPlatform = Math.abs(fighter.x - platform.x) < platform.w / 2 + PLATFORM_EDGE_GRACE;
            if (cameFromAbove && overPlatform) {
                landFighter(fighter, platform.y, 'pad', platform);
                break;
            }
        }
    }

    if (fighter.y >= FLOOR_Y && fighter.speedY > 0) {
        landFighter(fighter, FLOOR_Y, 'floor');
    }
}

function updateStretch(fighter, stepTime) {
    const targetStretchY = 1 + Math.min(MAX_SPEED_STRETCH, Math.abs(fighter.speedY) / SPEED_FOR_FULL_STRETCH);
    const targetStretchX = 1 / Math.sqrt(targetStretchY);

    fighter.stretchSpeedX += ((targetStretchX - fighter.stretchX) * STRETCH_SPRING - fighter.stretchSpeedX * STRETCH_DAMPING) * stepTime;
    fighter.stretchX += fighter.stretchSpeedX * stepTime;

    fighter.stretchSpeedY += ((targetStretchY - fighter.stretchY) * STRETCH_SPRING - fighter.stretchSpeedY * STRETCH_DAMPING) * stepTime;
    fighter.stretchY += fighter.stretchSpeedY * stepTime;

    fighter.stretchX = clamp(fighter.stretchX, MIN_STRETCH, MAX_STRETCH);
    fighter.stretchY = clamp(fighter.stretchY, MIN_STRETCH, MAX_STRETCH);
}

function updateKnockoutSpin(fighter, stepTime) {
    if (!fighter.dead) {
        return;
    }

    fighter.rotation += fighter.spin * stepTime;

    if (Math.abs(fighter.spin) < KO_SPIN_SETTLE_SPEED) {
        const targetRotation = Math.round(fighter.rotation / FULL_TURN) * FULL_TURN;
        fighter.rotation += (targetRotation - fighter.rotation) * Math.min(1, KO_SETTLE_RATE * stepTime);
    } else {
        fighter.spin *= Math.pow(KO_SPIN_SLOWDOWN, stepTime);
    }
}

function turnEyes(fighter, opponent, stepTime) {
    const lookTarget = clamp((opponent.x - fighter.x) / LOOK_DISTANCE, -1, 1) * fighter.face;
    fighter.look += (lookTarget - fighter.look) * Math.min(1, LOOK_TURN_RATE * stepTime);
}

function moveFighter(fighter, opponent, input, stepTime) {
    const fightIsLive = scene === 'fight' || scene === 'title';
    const canAct = fightIsLive && fighter.stunTimer <= 0 && !fighter.dead;

    fighter.previousY = fighter.y;
    tickTimers(fighter, stepTime);
    fighter.holdingJump = !!input.jumpHeld && !fighter.dead && fighter.stunTimer <= 0;

    if (canAct) {
        startActions(fighter, opponent, input);
    }

    moveSideways(fighter, opponent, input, canAct, stepTime);
    updatePunch(fighter, opponent, stepTime);
    fallAndMove(fighter, stepTime);

    bounceOffWalls(fighter, opponent);
    bounceOffCeiling(fighter);
    checkLanding(fighter);

    updateStretch(fighter, stepTime);
    updateKnockoutSpin(fighter, stepTime);
    turnEyes(fighter, opponent, stepTime);
}

function chooseInput(fighter, opponent, playerIndex, frameTime) {
    if (scene === 'fight') {
        if (fighter.ai) {
            return aiThink(fighter, opponent, frameTime);
        }
        return readPlayerInput(mode === 1 ? SOLO_KEYS[0] : PLAYER_KEYS[playerIndex]);
    }

    if (scene === 'title') {
        return aiThink(fighter, opponent, frameTime);
    }

    const keepsBouncing = scene === 'intro' || koWinner === fighter || (scene === 'roundEnd' && !fighter.dead) || scene === 'match';
    if (keepsBouncing) {
        return { jumpHeld: true };
    }

    return {};
}

function clearTaps(input) {
    input.jumpPressed = false;
    input.down = false;
    input.punch = false;
    input.superMove = false;
}

function keepFightersApart(fighterA, fighterB) {
    const gap = fighterB.x - fighterA.x;
    const overlap = MIN_FIGHTER_GAP - Math.abs(gap);

    if (overlap > 0 && Math.abs(fighterA.y - fighterB.y) < SAME_LEVEL_HEIGHT) {
        const pushDirection = gap >= 0 ? 1 : -1;
        const leftLimit = LEFT_WALL_X + HALF_BODY_WIDTH;
        const rightLimit = RIGHT_WALL_X - HALF_BODY_WIDTH;

        fighterA.x -= pushDirection * overlap / 2;
        fighterB.x += pushDirection * overlap / 2;
        fighterA.x = clamp(fighterA.x, leftLimit, rightLimit);
        fighterB.x = clamp(fighterB.x, leftLimit, rightLimit);
    }
}

function updateFighters(frameTime, timeScale) {
    const scaledTime = frameTime * timeScale;

    const inputs = [];
    for (let playerIndex = 0; playerIndex < 2; playerIndex++) {
        const fighter = fighters[playerIndex];
        const opponent = fighters[1 - playerIndex];
        inputs.push(chooseInput(fighter, opponent, playerIndex, frameTime));
    }

    if (scaledTime <= 0) {
        return false;
    }

    const stepCount = Math.max(1, Math.ceil(scaledTime / (1 / PHYSICS_STEPS_PER_SECOND)));
    const stepTime = scaledTime / stepCount;

    for (let step = 0; step < stepCount; step++) {
        for (let playerIndex = 0; playerIndex < 2; playerIndex++) {
            moveFighter(fighters[playerIndex], fighters[1 - playerIndex], inputs[playerIndex], stepTime);
            clearTaps(inputs[playerIndex]);
        }

        tryStomp(fighters[0], fighters[1]);
        tryStomp(fighters[1], fighters[0]);
        keepFightersApart(fighters[0], fighters[1]);
    }

    return true;
}

// ---------- update
function update(frameTime){
  T+=frameTime; animUI(frameTime);
  if(paused) return;
  let timeScale=1;
  if(hitstop>0){ hitstop-=frameTime; timeScale=0; } else if(scene==='ko') timeScale=0.35;
  const scaledTime=frameTime*timeScale;
  for (const platform of platforms) {
      platform.dipSpeed += (-platform.dip * PLATFORM_SPRING - platform.dipSpeed * PLATFORM_DAMPING) * scaledTime;
      platform.dip += platform.dipSpeed * scaledTime;
      platform.dip = clamp(platform.dip, -PLATFORM_MAX_RISE, PLATFORM_MAX_DIP);
  }
  floorTimeBank+=scaledTime; while(floorTimeBank>=1/60){ rippleFloor(); floorTimeBank-=1/60; }
  wall[0]=Math.max(0,wall[0]-frameTime*2.4); wall[1]=Math.max(0,wall[1]-frameTime*2.4);
  const ran=scene==='title'?false:updateFighters(frameTime,timeScale);
  // clear one-shot presses (unless frozen by hit-stop in a live fight)
  if(ran||(scene!=='fight')) tappedKeys.clear();
  // scenes
  if(scene==='intro'){ sceneT+=frameTime; if(sceneT>1.3){ scene='fight'; sceneT=0; banner('FIGHT!','',0.9,'#ffe14a'); fightSfx(); } }
  else if(scene==='fight'){
    timer-=scaledTime;
    if(timer<=0){
      timer=0;
      const a=fighters[0], b=fighters[1];
      const w=a.hp>b.hp?a:b.hp>a.hp?b:null;
      koWinner=w; banner('TIME!','',1.4,'#fff'); endRound(w);
    }
  }
  else if(scene==='ko'){ sceneT+=frameTime; if(sceneT>1.8) endRound(koWinner); }
  else if(scene==='roundEnd'){
    sceneT+=frameTime;
    if(sceneT>2.6){
      if(fighters[0].wins>=2||fighters[1].wins>=2){
        scene='match'; sceneT=0; endSel=0; if(!jingle('win')) winSfx(); confetti(W/2,H*0.7,80);
      } else { round++; startRound(); }
    }
  }
  else if(scene==='match'){ sceneT+=frameTime; if(Math.random()<frameTime*6) confetti(rand(100,W-100),H+10,6); }
  // ghost hp
  for(const f of fighters){ if(f.ghost>f.hp) f.ghost=Math.max(f.hp,f.ghost-frameTime*40); else f.ghost=f.hp; }
  // fx
  shake=Math.max(0,shake-frameTime*40); flashW=Math.max(0,flashW-frameTime*2.5);
  for (let index = particles.length - 1; index >= 0; index--) {
      const particle = particles[index];
      particle.life -= scaledTime;
      if (particle.life <= 0) {
          particles[index] = particles[particles.length - 1];
          particles.pop();
          continue;
      }
      particle.speedY += particle.g * scaledTime;
      particle.x += particle.speedX * scaledTime;
      particle.y += particle.speedY * scaledTime;
      particle.rotation += particle.spinSpeed * scaledTime;
  }
  for (let index = hitWords.length - 1; index >= 0; index--) {
      const word = hitWords[index];
      word.life -= frameTime;
      word.y += word.speedY * frameTime;
      if (word.life <= 0) {
          hitWords.splice(index, 1);
      }
  }
  for(let i=banners.length-1;i>=0;i--){ banners[i].age+=frameTime; if(banners[i].age>banners[i].dur) banners.splice(i,1); }
  if(superTag){ superTag.age+=frameTime; if(superTag.age>1) superTag=null; }
  if(scene==='match'&&sceneT>0.5&&banners.length===0){}
  // attract mode heal
  if(scene==='title'){ for(const f of fighters){ if(f.hp<35) f.hp=100; f.meter=Math.min(f.meter,60); } }
}
function endRound(w){
  if(w) w.wins++;
  scene='roundEnd'; sceneT=0;
  if(w){ banner(w.name.replace(' (CPU)','')+' WINS!','',2.3,w.c1); if(!jingle('win1')) winSfx(); confetti(w.x,w.y-60,40); }
  else { banner('DRAW!','',2.3,'#fff'); jingle('draw'); }
}

function rng(seed){ let s=seed; return ()=>{ s=(s*16807)%2147483647; return s/2147483647; }; }
function cloudBank(g,base,amp,col,seed){
  const r=rng(seed), bumps=[]; for(let x=-20;x<340;x+=10+Math.floor(r()*18)) bumps.push([x,8+r()*amp]);
  for(let x=0;x<320;x+=2){ let t=0; for(const [cx,rad] of bumps){ const d=x+1-cx; if(Math.abs(d)<rad) t=Math.max(t,Math.sqrt(rad*rad-d*d)); } const y=base-Math.round(t/2)*2; pr(g,x,y,2,180-y,col); }
}
function skyline(g,base,minH,maxH,cols,seed,win){
  const r=rng(seed); let x=-4;
  while(x<320){
    const bw=10+Math.floor(r()*16), bh=minH+Math.floor(r()*(maxH-minH)), col=cols[Math.floor(r()*cols.length)], top=base-bh, k=r();
    pr(g,x,top,bw,bh,col);
    if(k<0.3) pr(g,x+2,top-3,bw-4,3,col);
    else if(k<0.5){ pr(g,x+(bw>>1),top-8,1,8,col); pr(g,x+(bw>>1)-1,top-2,3,2,col); }
    else if(k<0.65) pr(g,x+1,top-4,5,4,col);
    if(win) for(let wy=top+3;wy<base-4;wy+=5) for(let wx=x+2;wx<x+bw-3;wx+=4) if(r()<0.2) pr(g,wx,wy,2,2,win);
    x+=bw+Math.floor(r()*3)-1;
  }
}
function fence(g,top,bot,c1,c2,gap){
  for(let x=0,i=0;x<320;x+=8,i++){ const c=i%2?c1:c2, o=(i*7)%3===0?1:0; pr(g,x,top+o+1,8,bot-top,c); pr(g,x+1,top+o,6,1,c); pr(g,x+7,top+o+1,1,bot-top,gap); }
}
function bushes(g,base,amp,col,edge,seed){
  const r=rng(seed); let y=base, prev=base;
  for(let x=0;x<320;x+=2){
    if(x%6===0){ prev=y; y=base+Math.round(Math.sin(x*0.05+seed)*amp+r()*4-2); }
    pr(g,x,y,2,180-y,col); pr(g,x,y,2,1,edge);
    if(x%6===0&&y!==prev) pr(g,x,Math.min(y,prev),1,Math.abs(y-prev)+1,edge);
  }
}
function palm(g,x,y,h,lean,trunk,leaf,leaf2){
  for(let i=0;i<h;i++) pr(g,x+Math.round(lean*(i/h)*(i/h)),y-i,2,1,trunk);
  const tx=x+Math.round(lean), ty=y-h;
  pr(g,tx-6,ty,6,2,leaf); pr(g,tx+2,ty,7,2,leaf); pr(g,tx-8,ty+2,3,2,leaf); pr(g,tx+7,ty+2,3,2,leaf);
  pr(g,tx-4,ty-2,4,2,leaf2); pr(g,tx+1,ty-2,5,2,leaf2); pr(g,tx-1,ty-1,3,3,leaf);
}

// ---------- drawing
function drawBG(dt){
  ctx.drawImage(BGS[bgIdx].out,0,0,W,H);
  ctx.fillStyle=THEMES[bgIdx].cloud;
  for(const c of clouds){
    c.x+=dt*8*c.s; if(c.x>W+120) c.x=-120;
    const q=v=>Math.round(v/PX)*PX, cx=c.x, cy=q(c.y*0.6), s=c.s; ctx.fillRect(cx,cy,q(96*s),q(24*s)); ctx.fillRect(cx+q(18*s),cy-q(15*s),q(54*s),q(15*s)); ctx.fillRect(cx+q(36*s),cy-q(27*s),q(27*s),q(12*s));
  }
}
function drawMat(){
  // the wobbly floor is built from 3px-wide columns so its surface is a clean pixel staircase
  for(let x=0;x<W;x+=PX){
    const hgt=floorDipAt(x+1.5), y=Math.round((FLOOR_Y+8+hgt)/PX)*PX;
    ctx.fillStyle='#222034'; ctx.fillRect(x,y-9,PX,18);
    ctx.fillStyle='#a48df3'; ctx.fillRect(x,y-6,PX,12);
    ctx.fillStyle='#ffffff'; ctx.fillRect(x,y-6,PX,PX);
    ctx.fillStyle='#27b4ec'; ctx.fillRect(x,y+9,PX,H-y);
    if((x+20)%90<45){ const ys=Math.max(y+9,FLOOR_Y+40); ctx.fillStyle='#1b9bd8'; ctx.fillRect(x,ys,PX,H-ys+9); }
    if(Math.floor(x/9)%2===0){ ctx.fillStyle='#ffffff'; ctx.fillRect(x,Math.round((FLOOR_Y+30+hgt*0.8)/PX)*PX,PX,PX); }
  }
}
// trampoline platforms: a padded yellow bar on a grey metal stand that reaches the ground
function drawPad(p){
  const wp=Math.round(p.w/PX), hl=Math.ceil((FLOOR_Y+16-(p.y+4))/PX);
  const legs=spr('legs'+p.w+'_'+p.y+'_'+(p.ov||0),wp+2,hl,g=>{
    const yb=Math.round(hl*0.5), o=Math.round((p.ov||0)/PX);       // o = how far the legs sit in from each end
    pr(g,7+o,yb,wp-12-2*o,3,OL); pr(g,7+o,yb+1,wp-12-2*o,1,'#aab4bf');
    for(const x of [4+o,wp-6-o]){ pr(g,x,0,4,hl,OL); pr(g,x+1,0,1,hl,'#eef2f5'); pr(g,x+2,0,1,hl,'#aab4bf'); }
  });
  ctx.drawImage(legs.out,p.x-legs.w/2,p.y+4,legs.w,legs.h);
  const top=spr('pad'+p.w,wp+2,8,g=>{
    pr(g,3,6,wp-4,2,OL);                                   // frame under the pad
    pBoxO(g,0,0,wp+2,7,'#ffcf3a',OL,3);
    pr(g,3,1,wp-4,1,'#ffeb9a'); pr(g,2,5,wp-2,1,'#e0a51f');
    for(let x=6;x<wp-4;x+=8) pr(g,x,2,1,3,'#e0a51f');      // stitched seams
  });
  ctx.drawImage(top.out,p.x-top.w/2,p.y+p.dip-5,top.w,top.h);
}
// side walls: tall grey poles with a blue foam sleeve (they flex outward when hit)
function drawWalls(){
  const s=spr('pole',9,180,g=>{
    pr(g,2,0,5,180,OL); pr(g,3,0,1,180,'#eef2f5'); pr(g,4,0,1,180,'#c3ccd6'); pr(g,5,0,1,180,'#9aa5b1');
    pBoxO(g,0,34,9,112,'#3d7fe0',OL,2);
    pr(g,2,36,1,108,'#7fb0f2'); pr(g,6,36,2,108,'#2f63b8');
    for(let y=52;y<140;y+=18) pr(g,1,y,7,1,'#2f63b8');
    pr(g,1,0,7,2,OL);
  });
  for(let side=0;side<2;side++){
    const off=Math.round(Math.abs(wall[side]*6*Math.sin(T*32))/PX)*PX;
    ctx.save();
    if(side===1){ ctx.translate(W,0); ctx.scale(-1,1); }
    ctx.drawImage(s.out,42-off,0,s.w,s.h);
    ctx.restore();
  }
}

const FOX=66, FOY=177, FS=bake(70,64);
function drawFace(g,f,x0,y0,solid){
  const F=FACES[f.ch];
  for(let y=0;y<F.h;y++) for(let x=0;x<F.w;x++){
    const ch=F.px[y*F.w+x]; if(ch==='.') continue;
    pr(g,x0+x,y0+y,1,1,solid||(ch==='z'?OL:F.pal[ch.charCodeAt(0)-97]));
  }
}
function fighterBase(f){
  return spr('fb'+f.ch,70,64,g=>{
    const X=22, Y=59;
    pEllO(g,X-9,Y-3,9,5,'#ff8a3d','#5a2a10'); pEllO(g,X+1,Y-3,9,5,'#ff8a3d','#5a2a10');
    drawFace(g,f,X-15,Y-37);
  });
}
function drawFighter(f){
  const sink=(f.y>=FLOOR_Y-2)?floorDipAt(f.x)*0.9:0;
  ctx.save();
  const dist=clamp((FLOOR_Y-f.y)/300,0,1);
  if(dist<0.85){
    const sh=spr('shadow',20,5,g=>pEll(g,0,0,20,5,'#6f5cc4')), k=1-dist*0.6;
    ctx.drawImage(sh.out,f.x-30*k,FLOOR_Y+4+floorDipAt(f.x)-7.5*k,sh.w*k,sh.h*k);
  }
  ctx.translate(f.x,f.y+sink);
  if(f.dead){ ctx.translate(0,-45); ctx.rotate(f.rotation); ctx.translate(0,45); }
  ctx.scale(f.face*f.stretchX,f.stretchY);
  const g=FS.g, X=22, Y=59, stunned=f.stunTimer>0||f.dead, punching=f.punchTimer>0;
  g.clearRect(0,0,70,64);
  if(f.meter>=100&&!f.dead&&Math.sin(T*10)>0) pBox(g,X-18,Y-40,36,43,'#fff3a0',13);
  if(f.slam) for(const lx of [-7,-1,5]) pr(g,X+lx,Y-56+Math.abs(lx+1),2,9,'#ffffff');
  const bob=Math.round(Math.sin(T*9+f.i)*0.8);
  // glove colours: blue for player 1 (WASD), red for player 2 (arrows)
  const GL=f.i===0?['#3d8bff','#12305a','#9ac4ff','#d0e2ff']:['#ff4d6d','#5a1230','#ff9aa9','#ffd0dc'];
  pEllO(g,X-20,Y-17+bob,8,8,GL[0],GL[1]);
  g.drawImage(fighterBase(f).out,0,0);
  // dizzy stars circling the head while stunned
  if(stunned) for(let k=0;k<2;k++){ const a=T*10+k*Math.PI; pr(g,X-1+Math.round(Math.cos(a)*11),Y-41+Math.round(Math.sin(a)*2),2,2,'#ffe14a'); }
  // front glove (+ arm when punching)
  let gs=9, gcx=16, gcy=-11+bob;
  if(punching){
    const p=Math.sin(Math.PI*clamp((0.24-f.punchTimer)/0.24,0,1));
    gcx=16+Math.round(22*p); gcy=-15; gs=9+Math.round(3*p);
    pr(g,X+11,Y-17,gcx-11,4,GL[1]); pr(g,X+11,Y-16,gcx-11,2,GL[3]);
    if(p>0.4) for(let k=0;k<3;k++) pr(g,X+gcx-(gs>>1)-7,Y+gcy-4+k*3,5,1,'#ffffff');
  }
  const gx0=X+gcx-(gs>>1), gy0=Y+gcy-(gs>>1);
  pEllO(g,gx0,gy0,gs,gs,GL[0],GL[1]); pr(g,gx0+2,gy0+2,2,2,GL[2]);
  // hit flash: solid white head
  if(f.flash>0.05) g.drawImage(spr('fw'+f.ch,70,64,gg=>drawFace(gg,f,X-15,Y-37,'#ffffff')).out,0,0);
  ctx.drawImage(FS.out,-FOX,-FOY,FS.w,FS.h);
  ctx.restore();
}
function starSprite(col){
  return spr('star'+col,13,13,g=>{
    const pts=[]; for(let i=0;i<10;i++){ const a=i*Math.PI/5-Math.PI/2, r=i%2?2.5:5.5; pts.push([6.5+Math.cos(a)*r,6.8+Math.sin(a)*r]); }
    const inside=(x,y)=>{ let c=false; for(let i=0,j=9;i<10;j=i++){ const a=pts[i], b=pts[j]; if((a[1]>y)!==(b[1]>y)&&x<(b[0]-a[0])*(y-a[1])/(b[1]-a[1])+a[0]) c=!c; } return c; };
    const m=[]; for(let y=0;y<13;y++){ m.push([]); for(let x=0;x<13;x++){ const l=inside(x+0.5,y+0.5), r=inside(12.5-x,y+0.5); m[y].push(l||r); } }
    for(let y=0;y<13;y++) for(let x=0;x<13;x++){
      if(m[y][x]) pr(g,x,y,1,1,col);
      else if((m[y][x-1])||(m[y][x+1])||(m[y-1]&&m[y-1][x])||(m[y+1]&&m[y+1][x])) pr(g,x,y,1,1,OL);
    }
  });
}
const FADE_TIME = 0.5;
const SMALLEST_SCALE = 0.4;
const SCALE_RANGE = 0.6;

const STAR_BASE_SIZE = 12;
const STAR_DRAW_SIZE = 39;

const DUST_BASE_SIZE = 10;
const DUST_DRAW_SIZE = 24;
const DUST_SPRITE_SIZE = 8;

const RING_START_SIZE = 0.2;
const RING_GROWTH = 0.8;
const RING_BLINK_START = 0.75;
const RING_BLINK_SPEED = 30;
const RING_THICK_UNTIL = 0.5;

const BLINK_SPEED = 20;
const CONFETTI_BLINK_TIME = 0.3;

const WORD_BLINK_TIME = 0.25;
const WORD_START_SCALE = 0.6;
const WORD_POP_SCALE = 0.5;
const WORD_POP_SPEED = 4;
const WORD_OUTLINE_COLOUR = '#222034';

function particleScale(particle, baseSize) {
    const fade = clamp(particle.life / Math.min(particle.max, FADE_TIME), 0, 1);
    return particle.size / baseSize * (SMALLEST_SCALE + SCALE_RANGE * fade);
}

function drawStar(particle) {
    const sprite = starSprite(particle.col);
    const scale = particleScale(particle, STAR_BASE_SIZE);
    const half = STAR_DRAW_SIZE / 2 * scale;
    const size = STAR_DRAW_SIZE * scale;

    ctx.save();
    ctx.translate(particle.x, particle.y);
    ctx.rotate(particle.rotation);
    ctx.drawImage(sprite.out, -half, -half, size, size);
    ctx.restore();
}

function drawDust(particle) {
    const sprite = spr('dot' + particle.col, DUST_SPRITE_SIZE, DUST_SPRITE_SIZE, pen => pEll(pen, 0, 0, DUST_SPRITE_SIZE, DUST_SPRITE_SIZE, particle.col));
    const scale = particleScale(particle, DUST_BASE_SIZE);
    const half = DUST_DRAW_SIZE / 2 * scale;
    const size = DUST_DRAW_SIZE * scale;

    ctx.drawImage(sprite.out, particle.x - half, particle.y - half, size, size);
}

function drawRingSquares(centreX, centreY, stepsAcross, stepsDown) {
    const across = stepsAcross * PX;
    const down = stepsDown * PX;

    ctx.fillRect(centreX - across, centreY - down, PX, PX);
    ctx.fillRect(centreX - across, centreY + down, PX, PX);
    ctx.fillRect(centreX + across, centreY - down, PX, PX);
    ctx.fillRect(centreX + across, centreY + down, PX, PX);
}

function drawRing(particle) {
    const progress = 1 - particle.life / particle.max;
    const radius = Math.round(particle.size * (RING_START_SIZE + RING_GROWTH * Math.sqrt(progress)) / PX);
    const centreX = Math.round(particle.x / PX) * PX;
    const centreY = Math.round(particle.y / PX) * PX;

    const blinkedOff = Math.floor(T * RING_BLINK_SPEED) % 2 === 0;
    if (progress > RING_BLINK_START && blinkedOff) {
        return;
    }

    ctx.fillStyle = particle.col;

    const layers = progress < RING_THICK_UNTIL ? 2 : 1;
    for (let layer = 0; layer < layers; layer++) {
        const r = radius - layer;
        if (r < 1) {
            break;
        }
        for (let i = 0; 2 * i * i <= r * r + r; i++) {
            const j = Math.round(Math.sqrt(r * r - i * i));
            drawRingSquares(centreX, centreY, i, j);
            drawRingSquares(centreX, centreY, j, i);
        }
    }
}

function drawConfetti(particle) {
    const blinkedOn = Math.floor(T * BLINK_SPEED) % 2;
    if (particle.life > CONFETTI_BLINK_TIME || blinkedOn) {
        ctx.save();
        ctx.translate(particle.x, particle.y);
        ctx.rotate(particle.rotation);
        ctx.fillStyle = particle.col;
        ctx.fillRect(-particle.size / 2, -particle.size / 4, particle.size, particle.size / 2);
        ctx.restore();
    }
}

function drawHitWords() {
    for (const word of hitWords) {
        const blinkedOff = Math.floor(T * BLINK_SPEED) % 2 === 0;
        if (word.life < WORD_BLINK_TIME && blinkedOff) {
            continue;
        }

        const progress = 1 - word.life / word.max;
        const pop = easeOutBack(clamp(progress * WORD_POP_SPEED, 0, 1));
        const size = word.size * (WORD_START_SCALE + WORD_POP_SCALE * pop);

        text(word.t, word.x, word.y, size, word.col, WORD_OUTLINE_COLOUR);
    }
}

function drawParticles() {
    for (const particle of particles) {
        if (particle.t === 'star') {
            drawStar(particle);
        } else if (particle.t === 'dot') {
            drawDust(particle);
        } else if (particle.t === 'ring') {
            drawRing(particle);
        } else {
            drawConfetti(particle);
        }
    }

    drawHitWords();
}
function hpBar(f,left){
  const BW=402, bx=left?12:W-12-BW, q=v=>Math.round(v/PX)*PX;
  // health: white frame, flat fill
  ctx.fillStyle='#ffffff'; ctx.fillRect(bx-3,3,BW+6,21);
  ctx.fillStyle='#45283c'; ctx.fillRect(bx,6,BW,15);
  const gw=q(BW*f.ghost/100), hw=q(BW*f.hp/100), pct=f.hp/100;
  ctx.fillStyle='#cbdbfc'; ctx.fillRect(left?bx:bx+BW-gw,6,gw,15);
  ctx.fillStyle=pct>0.5?'#6abe30':pct>0.25?'#fbf236':'#d95763'; ctx.fillRect(left?bx:bx+BW-hw,6,hw,15);
  // super meter: thin strip under the health bar
  const mw=q(BW*f.meter/100), full=f.meter>=100;
  ctx.fillStyle='#45283c'; ctx.fillRect(bx,27,BW,6);
  ctx.fillStyle=full?(Math.floor(T*8)%2?'#fbf236':'#df7126'):'#d77bba'; ctx.fillRect(left?bx:bx+BW-mw,27,mw,6);
  // name, SUPER prompt, round pips
  const nm=f.name.replace(' (CPU)',''), nw=nm.length*6*PX+18;
  text(nm,left?bx:bx+BW,45,24,f.c1,null,left?'left':'right');
  if(full&&Math.floor(T*6)%2===0) text(superKey(f)?'PRESS '+superKey(f)+'!':'SUPER!',left?bx+nw:bx+BW-nw,45,24,'#fbf236',null,left?'left':'right');
  for(let k=0;k<2;k++){
    ctx.fillStyle=k<f.wins?'#fbf236':'#45283c';
    ctx.fillRect(left?bx+BW-12-k*18:bx+k*18,39,12,12);
  }
  if(f.combo>=2&&f.comboTimer>0&&Math.floor(T*16)%8!==0) text(f.combo+' HIT COMBO!',left?bx:bx+BW,81,24,'#fbf236','#222034',left?'left':'right');
}
function drawHUD(){
  const p=(scene==='intro'&&round===1)?clamp((sceneT-0.2)/0.45,0,1):1, hy=Math.round(-(1-p)*(1-p)*66/PX)*PX;
  ctx.save(); ctx.translate(0,hy);
  ctx.fillStyle='#000000'; ctx.fillRect(0,-66,W,129);
  hpBar(fighters[0],true); hpBar(fighters[1],false);
  const low=timer<10&&Math.floor(T*4)%2===0;
  gtext(String(Math.ceil(Math.max(0,timer))),W/2,30,2,low?['#d95763','#d95763','#d95763','#ac3232','#ac3232','#ac3232','#ac3232']:GRAD_Y);
  ctx.restore();
}
function drawBanners(){
  for(const b of banners){
    const tin=clamp(b.age/0.2,0,1), tout=clamp((b.dur-b.age)/0.16,0,1);
    const x=W/2-(1-easeOutBack(tin))*W*0.75+(1-tout)*(1-tout)*W;
    text(b.t,x,H*0.4,b.t.length>14?44:b.t.length>10?64:88,b.col,'#222034');
  }
  if(superTag&&superTag.age<0.9){ const e=easeOutBack(clamp(superTag.age/0.18,0,1)); text(superTag.t,W/2,H*0.25-(1-e)*90,54,superTag.col,'#222034'); }
}
// ---- menu UI: black banner, big play buttons, everything else tucked behind HELP
function band(y,h){ ctx.fillStyle='#000000'; ctx.fillRect(0,y,W,h); ctx.fillRect(0,y-12,W,6); ctx.fillRect(0,y+h+6,W,6); }
const GRAD_W=['#ffffff','#ffffff','#cbdbfc','#cbdbfc','#9badb7','#9badb7','#847e87'];
const GRAD_Y=['#fbf236','#fbf236','#fbf236','#df7126','#df7126','#df7126','#8a6f30'];
function gtext(t,x,y,k,cols,align){
  const s=String(t).toUpperCase(), u=k*PX, w=bmpW(s,u);
  let x0=align==='left'?x:align==='right'?x-w:x-w/2;
  x0=Math.round(x0/PX)*PX; const y0=Math.round((y-3.5*u)/PX)*PX;
  for(let r=0;r<7;r++){
    ctx.fillStyle=cols[r];
    for(let i=0;i<s.length;i++){ const g=FONTD[s[i]]; if(!g||!g[r]) continue;
      for(let cc=0;cc<5;cc++) if(g[r]&(16>>cc)) ctx.fillRect(x0+(i*6+cc)*u,y0+r*u,u,u); }
  }
}
function playBtn(cx,cy,label,col,hot){
  const y=cy+(hot?-6:0);
  const s=spr('play'+hot,56,56,g=>{
    // exact pixel triangle: every row is 2 pixels longer than the one before it, mirrored top to bottom,
    // so both slanted edges are identical even staircases and the tip is a clean 2-pixel point
    for(let j=0;j<56;j++){
      const len=2*Math.min(j+1,56-j);
      pr(g,0,j,len,1,'#000000');
      pr(g,3,j,len-10,1,hot?'#fbf236':'#ffffff');
    }
  });
  ctx.drawImage(s.out,cx-72,y-84,s.w,s.h);
  ptext(ctx,label,cx-6,y+60,2,col,'#000000');
}
const q3=v=>Math.round(v/PX)*PX;
function tileBtn(cx,cy,hot,kind){
  const y=cy+(hot?-6:0), fill=hot?'#fbf236':'#ffffff';
  const s=spr('tile'+kind+hot,46,38,g=>{
    pBox(g,0,0,46,38,'#000000',10); pBox(g,3,3,40,32,fill,7);
    if(kind==='set'){   // gear icon
      pr(g,21,7,4,24,'#000000'); pr(g,11,17,24,4,'#000000');
      for(const [gx,gy] of [[14,10],[28,10],[14,24],[28,24]]) pr(g,gx,gy,4,4,'#000000');
      pEll(g,14,10,18,18,'#000000'); pEll(g,19,15,8,8,fill);
    }
  });
  ctx.drawImage(s.out,cx-69,y-72,s.w,s.h);
  if(kind==='help') ptext(ctx,'?',cx,y-15,3,'#000000',null);
  ptext(ctx,kind==='help'?'HELP':'SOUND',cx,y+57,2,kind==='help'?'#df7126':'#fbf236','#000000');
}
function drawPause(a){
  ctx.fillStyle='rgba(0,0,0,'+(0.62*a)+')'; ctx.fillRect(0,0,W,H);
  const h=q3(282*a); band(282-h/2,h);
  if(a<0.95||ui!=='pause') return;
  gtext('PAUSED',W/2,201,3,GRAD_W);
  for(let i=0;i<3;i++){
    const on=sel===i, t=PAUSE_OPTS[i];
    text(t,W/2,PAUSE_Y[i],44,on?'#fbf236':'#ffffff',null);
    if(on) text('>',W/2-t.length*18-30,PAUSE_Y[i],44,'#fbf236',null);
  }
}
function drawSettings(){
  ctx.fillStyle='rgba(0,0,0,'+(uiFrom==='pause'?0.62:0.35)+')'; ctx.fillRect(0,0,W,H);
  band(171,276);
  gtext('SETTINGS',W/2,207,2,GRAD_Y);
  for(let r=0;r<2;r++){
    const y=SET_Y[r], on=sel===r, v=r===0?musicVolN:sfxVolN;
    if(on) text('>',186,y,44,'#fbf236',null,'left');
    text(r===0?'MUSIC':'SOUND',228,y,44,on?'#fbf236':'#ffffff',null,'left');
    for(let i=0;i<10;i++){ ctx.fillStyle=i<v?(on?'#fbf236':'#99e550'):'#45283c'; ctx.fillRect(BAR_X+i*30,y-15,27,30); }
  }
  const on=sel===2;
  text('BACK',W/2,SET_Y[2],44,on?'#fbf236':'#ffffff',null);
  if(on) text('>',W/2-4*18-30,SET_Y[2],44,'#fbf236',null);
  text('ARROWS OR MOUSE TO CHANGE',W/2,426,24,'#9badb7',null);
}
function drawHelp(a){
  const h=q3(270*a); band(339-h/2,h);
  if(a<0.95) return;
  gtext('HOW TO PLAY',W/2,234,2,GRAD_Y);
  text('P1: A/D MOVE  W JUMP  S SLAM  F PUNCH  G SUPER',W/2,285,24,'#99e550',null);
  text('P2: ARROWS MOVE/JUMP/SLAM  K PUNCH  L SUPER',W/2,315,24,'#639bff',null);
  text('HOLD JUMP = BIG BOUNCE. LAND ON HEADS = STOMP!',W/2,357,24,'#ffffff',null);
  text('WALLS SPLAT YOU. FIRST TO 2 ROUNDS WINS!',W/2,387,24,'#ffffff',null);
  text('P = PAUSE   M = MUTE MUSIC   S = SOUND SETTINGS',W/2,417,24,'#9badb7',null);
  text('CLICK OR PRESS ANY KEY TO CLOSE',W/2,453,24,'#df7126',null);
}
function drawTitle(){
  ctx.fillStyle='rgba(0,0,0,.62)'; ctx.fillRect(0,0,W,H);
  // banner drops in from the top
  const by=q3((easeOutBack(clamp(menuT/0.45,0,1))-1)*150);
  band(63+by,84);
  gtext('BOUNCE BACK',177,105+by,2,GRAD_W,'left');
  gtext('BRAWL',609,105+by,2,GRAD_Y,'left');
  if(helpA>0.01){ drawHelp(helpA); return; }
  // buttons pop up one after another
  for(let i=0;i<3;i++){
    const oy=q3((1-easeOutBack(clamp((menuT-0.2-i*0.09)/0.35,0,1)))*260);
    if(i===0) playBtn(BTN_X[0],BTN_Y+oy,'PLAY','#99e550',hover===0); else tileBtn(BTN_X[i],BTN_Y+oy,hover===i,i===1?'help':'set');
  }
  // footer slides up
  const fo=q3((1-clamp((menuT-0.5)/0.3,0,1))*60);
  ctx.fillStyle='#000000'; ctx.fillRect(171,492+fo,618,39);
  let fx=183;
  for(const [s,col] of [['ENTER = PLAY','#99e550'],['H = HELP','#df7126'],['S = SOUND','#fbf236']]){
    ptext(ctx,s,fx,510+fo,1,col,null,'left'); fx+=(s.length+2)*6*PX;
  }
}
function drawMatch(){
  const a=clamp(sceneT/0.3,0,1);
  ctx.fillStyle='rgba(0,0,0,'+(0.62*a)+')'; ctx.fillRect(0,0,W,H);
  const w=fighters[0].wins>fighters[1].wins?fighters[0]:fighters[1], h=q3(96*a);
  band(219-h/2,h);
  if(a<1) return;
  text(w.name.replace(' (CPU)','')+' WINS!',W/2,219,66,w.c1,null);
  // REMATCH / MENU buttons pop up from below
  for(let i=0;i<2;i++){
    const on=endSel===i, t=clamp((sceneT-0.6-i*0.08)/0.3,0,1); if(t<=0) continue;
    const y=END_Y+q3((1-easeOutBack(t))*240)+(on?-6:0);
    const sp=spr('endbtn'+on,92,24,g=>{ pBox(g,0,0,92,24,'#000000',7); pBox(g,3,3,86,18,on?'#fbf236':'#ffffff',4); });
    ctx.drawImage(sp.out,END_X[i]-138,y-36,sp.w,sp.h);
    ptext(ctx,END_LBL[i],END_X[i],y,2,'#000000',null);
  }
}
// key-cap prompt bobbing above a fighter whose super is ready
function drawSuperCue(f){
  const key=superKey(f); if(!key||f.dead||f.meter<100) return;
  const sp=spr('keycap',11,13,g=>{ pBox(g,0,0,11,13,OL,2); pBox(g,1,1,9,9,'#ffffff',1); pr(g,1,10,9,2,'#9badb7'); });
  const left=q3(f.x-16.5), top=q3(clamp(f.y-159+Math.sin(T*8)*5,66,H));
  ctx.drawImage(sp.out,left,top,sp.w,sp.h);
  ptext(ctx,key,left+16.5,top+15,1,Math.floor(T*6)%2?'#000000':'#d95763',null);
}
function render(dt){
  ctx.setTransform(scale,0,0,scale,0,0);
  ctx.imageSmoothingEnabled=false;
  ctx.clearRect(0,0,W,H);
  ctx.save();
  if(shake>0) ctx.translate(Math.round(rand(-shake,shake)*0.6/PX)*PX,Math.round(rand(-shake,shake)*0.6/PX)*PX);
  drawBG(paused?0:dt);
  for(const p of platforms) drawPad(p);
  drawMat();
  if(scene!=='title'){
    for(const f of fighters) if(f.i===0) drawFighter(f);
    for(const f of fighters) if(f.i===1) drawFighter(f);
    for(const f of fighters) drawSuperCue(f);
  }
  drawParticles();
  drawWalls();
  ctx.restore();
  if(flashW>0){ ctx.fillStyle='rgba(255,255,255,'+flashW*0.6+')'; ctx.fillRect(0,0,W,H); }
  if(scene==='title') drawTitle();
  else { drawHUD(); drawBanners(); if(scene==='match') drawMatch(); }
  if(inGame()&&!paused&&!trans){   // pause button
    ctx.fillStyle='#000000'; ctx.fillRect(W-42,H-42,30,30);
    ctx.fillStyle='#ffffff'; ctx.fillRect(W-36,H-36,6,18); ctx.fillRect(W-24,H-36,6,18);
  }
  if(pauseA>0.01&&ui!=='settings') drawPause(pauseA);
  if(ui==='settings') drawSettings();
  drawIris();
  if(!musicOn) text('MUSIC OFF (M)',W-14,H-18,24,'#ffffff','#222034','right');
}

// ---------- loop
setupAttract();
let last=performance.now();
function frame(now){
  let dt=(now-last)/1000; last=now;
  if(!(dt>0)) dt=1/60; if(dt>0.05) dt=0.05;
  update(dt); render(dt);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
// expose a tiny hook for automated smoke tests
window.__bbb={pads: platforms,layout:()=>layoutIdx,SPR,BGS,FS,drawFighter,update,render,startMatch,fighters:()=>fighters,scene:()=>scene,menuKey,down: heldKeys,pressed: tappedKeys};
})();
</script>
